name: Package vulnerabilities

on:
  schedule:
    - cron: "41 4 * * 1"
  pull_request:
    paths:
      - "**/*.csproj"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulnerable-packages:
    name: Check NuGet packages for known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: List vulnerable packages (direct and transitive)
        run: |
          failed=0
          for project in $(find . -name "*.csproj" -not -path "*/obj/*"); do
            echo "== $project"
            dotnet restore "$project" > /dev/null
            output=$(dotnet list "$project" package --vulnerable --include-transitive 2>&1)
            echo "$output"
            if echo "$output" | grep -q "has the following vulnerable packages"; then
              failed=1
            fi
          done
          exit $failed
