name: Dependency review

# Blocks a pull request that adds a dependency with a known vulnerability or an unwanted license.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review new dependencies
    runs-on: ubuntu-latest
    # Needs "Dependency graph" enabled in Settings > Advanced Security. Until then the action errors out on every PR,
    # so a failure here is reported but does not block merging. Remove this line once the graph is on.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          # ArabFaker.NET is MIT licensed; strong copyleft dependencies would conflict with that.
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          comment-summary-in-pr: on-failure
