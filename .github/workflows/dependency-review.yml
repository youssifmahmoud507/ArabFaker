name: Dependency review

# Blocks a pull request that adds a dependency with a known vulnerability or an unwanted license.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review new dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # ArabFaker.NET is MIT licensed; strong copyleft dependencies would conflict with that.
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          comment-summary-in-pr: on-failure
