name: OpenSSF Scorecard

# Scores the repository's supply-chain security (branch protection, pinned dependencies, token permissions, ...).

on:
  branch_protection_rule:
  schedule:
    - cron: "31 6 * * 2"
  push:
    branches: [master]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # The action pulls its image from gcr.io, which currently answers "billing must be enabled" for anonymous pulls.
    # That is outside this repository, so a failure is reported but must not turn master red.
    continue-on-error: true
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
