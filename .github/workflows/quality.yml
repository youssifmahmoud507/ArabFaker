name: Code quality

# Informational report: formatting and compiler/analyzer warnings. Nothing here fails a PR;
# read the summary to decide what is worth fixing.

on:
  pull_request:
  schedule:
    - cron: "5 6 * * 4"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Formatting
        continue-on-error: true
        run: |
          echo "### Formatting" >> "$GITHUB_STEP_SUMMARY"
          dotnet format ArabFaker.slnx --verify-no-changes --verbosity minimal 2>&1 | tail -40 | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Warnings with the latest analyzers
        continue-on-error: true
        run: |
          echo "### Warnings" >> "$GITHUB_STEP_SUMMARY"
          dotnet build ArabFaker.NET/ArabFaker.NET.csproj --configuration Release -p:AnalysisMode=All -p:EnforceCodeStyleInBuild=true 2>&1 | grep -E "warning (CA|IDE|CS)" | sort -u | head -60 | tee -a "$GITHUB_STEP_SUMMARY" || true
